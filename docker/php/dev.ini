; Réglages PHP pour le développement (chargés via compose.override.yaml)

; Temps maximum d'une requête (30 s par défaut)
max_execution_time = 120
memory_limit = 512M

; Cache des chemins de fichiers : évite de redemander sans cesse au disque où sont les fichiers
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache : garde le PHP déjà compilé en mémoire
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
; Vérifie au plus une fois par seconde si un fichier a changé (tes modifications restent visibles)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1
