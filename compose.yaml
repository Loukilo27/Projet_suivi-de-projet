# =====================================================================
#  Configuration COMMUNE (PC + serveur)
#  - En local : "docker compose up" ajoute automatiquement compose.override.yaml
#  - Sur le serveur : on ajoute compose.prod.yaml à la place
# =====================================================================
services:

  # --- Conteneur 1 : l'application Symfony (PHP + serveur web) ---
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      # Adresse de la base : "database" = le nom du conteneur MySQL ci-dessous
      DATABASE_URL: "mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=8.4.0&charset=utf8mb4"
    depends_on:
      database:
        condition: service_healthy   # attend que MySQL soit prêt
    volumes:
      - caddy_data:/data             # certificats HTTPS
      - caddy_config:/config

  # --- Conteneur 2 : la base de données MySQL ---
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      # LES DONNÉES sont ici : un volume géré par Docker, PAS dans ton dossier
      - database_data:/var/lib/mysql

volumes:
  database_data:
  caddy_data:
  caddy_config:
